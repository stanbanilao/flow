<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101114">
<title>Thynkverse Flow</title>
<script src="https://unpkg.com/cytoscape@3.30.2/dist/cytoscape.min.js"></script>
<style>
:root{--bg:#101114;--surface:#17191d;--surface2:#202329;--border:#353943;--text:#f3efe8;--muted:#a6adb7;--orange:#f28b30;--orange2:#ffb26d;--blue:#78a9ff;--green:#64c98d;--purple:#b595ff;--yellow:#e4c25f;--red:#e47878;--cream:#f2ece1}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}button,select,input{font:inherit}.app{min-height:100vh;background:radial-gradient(circle at 90% 0,rgba(242,139,48,.09),transparent 28%),var(--bg)}
header{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:13px 16px;border-bottom:1px solid var(--border);background:rgba(16,17,20,.96);position:sticky;top:0;z-index:30;backdrop-filter:blur(10px)}.brand{display:flex;align-items:center;gap:10px;min-width:0}.mark{width:38px;height:38px;border-radius:11px;background:linear-gradient(145deg,var(--orange),#dc651e);display:grid;place-items:center;color:#171717;font-weight:950;flex:0 0 auto}.brand h1{font-size:16px;margin:0}.brand p{font-size:11px;color:var(--muted);margin:2px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.headActions{display:flex;align-items:center;gap:7px;flex-wrap:wrap;justify-content:flex-end}.btn{min-height:40px;border:1px solid var(--border);background:var(--surface2);color:var(--text);border-radius:10px;padding:8px 11px;cursor:pointer;font-weight:700}.btn:hover{border-color:#626875}.btn.on{background:rgba(242,139,48,.14);border-color:var(--orange);color:var(--orange2)}.btn.primary{background:var(--orange);border-color:var(--orange);color:#171717}.btn.danger{color:#ffb0b0}.search{min-height:40px;width:190px;border:1px solid var(--border);background:#111216;color:var(--text);border-radius:10px;padding:8px 10px}
.toolbar{padding:10px 16px;border-bottom:1px solid var(--border);display:flex;gap:10px;align-items:end;flex-wrap:wrap;background:#121317}.control{display:grid;gap:4px}.control label{font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:800}.control select{min-height:39px;border:1px solid var(--border);background:var(--surface2);color:var(--text);border-radius:9px;padding:7px 30px 7px 10px}.layoutState{margin-left:auto;font-size:11px;color:var(--muted);padding-bottom:8px}
main{display:grid;grid-template-columns:minmax(0,1fr) 385px;min-height:calc(100vh - 116px)}.mapWrap{position:relative;min-height:720px;overflow:hidden}.mapHint{position:absolute;left:13px;top:13px;z-index:10;border:1px solid var(--border);background:rgba(23,25,29,.92);border-radius:10px;padding:8px 10px;font-size:11px;color:var(--muted);pointer-events:none}.legend{position:absolute;left:13px;bottom:13px;z-index:10;display:flex;flex-wrap:wrap;gap:6px;max-width:80%}.legend span{border:1px solid var(--border);background:rgba(23,25,29,.94);border-radius:999px;padding:5px 7px;font-size:10px;color:var(--muted)}#cy{position:absolute;inset:0}
aside{border-left:1px solid var(--border);background:var(--surface);padding:18px;overflow:auto;max-height:calc(100vh - 116px)}.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.13em;color:var(--orange2);font-weight:900}.detail h2{margin:6px 0 8px;font-size:24px;line-height:1.1}.desc{font-size:13px;line-height:1.55;color:#c7ccd3}.why{margin-top:14px;border-left:3px solid var(--orange);background:rgba(242,139,48,.07);padding:11px;border-radius:0 9px 9px 0;font-size:12px;line-height:1.5}.why b{color:var(--orange2)}.section{border-top:1px solid var(--border);padding-top:14px;margin-top:14px}.section h3{font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:0 0 9px}.pills{display:flex;gap:5px;flex-wrap:wrap}.pill{border-radius:999px;background:#2a2e35;color:#d8dce2;font-size:10px;padding:5px 8px;font-weight:750}.pill.orange{background:rgba(242,139,48,.14);color:var(--orange2)}.reqs{display:grid;gap:7px}.req{border:1px solid #30343c;background:var(--surface2);border-radius:9px;padding:9px 10px;font-size:12px;line-height:1.35}.nexts{display:flex;flex-wrap:wrap;gap:6px}.next{border:1px solid var(--border);background:#121419;color:#d8dce2;border-radius:8px;padding:7px 9px;font-size:11px;cursor:pointer}.advice{margin-top:12px;padding:11px;border:1px solid #3b404a;background:#131519;border-radius:11px}.advice b{font-size:12px}.advice p{font-size:11px;line-height:1.5;color:var(--muted);margin:6px 0 0}.mobileDock{display:none}.statusDot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:5px}.empty{font-size:12px;color:var(--muted)}
@media(max-width:900px){header{align-items:flex-start}.brand p{max-width:180px}.headActions{gap:5px}.search{display:none}.headActions .btn{padding:7px 9px;font-size:12px}.toolbar{display:grid;grid-template-columns:1fr 1fr;padding:9px 10px;gap:8px}.control select{width:100%;font-size:13px}.layoutState{grid-column:1/-1;margin:0;padding:0;font-size:10px}main{display:block;min-height:auto}.mapWrap{min-height:58vh}.mapHint{top:8px;left:8px;right:8px;text-align:center}.legend{display:none}aside{border-left:0;border-top:1px solid var(--border);max-height:none;padding:15px}.detail h2{font-size:21px}.mobileDock{display:flex;position:sticky;bottom:0;z-index:25;background:rgba(16,17,20,.96);border-top:1px solid var(--border);padding:8px;gap:7px}.mobileDock .btn{flex:1;font-size:11px;padding:7px 6px}}
@media(max-width:480px){header{padding:10px}.mark{width:34px;height:34px}.brand h1{font-size:14px}.brand p{max-width:135px}.headActions #fitBtn,.headActions #resetBtn{display:none}.toolbar{grid-template-columns:1fr}.layoutState{grid-column:auto}.mapWrap{min-height:55vh}}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="brand"><div class="mark">T</div><div><h1>Thynkverse Flow</h1><p>Business structure • process • people • systems • automation</p></div></div>
  <div class="headActions">
    <input id="search" class="search" placeholder="Find a process…">
    <button id="editBtn" class="btn" type="button">Edit layout</button>
    <button id="fitBtn" class="btn" type="button">Fit all</button>
    <button id="resetBtn" class="btn danger" type="button">Reset</button>
  </div>
</header>
<div class="toolbar">
  <div class="control"><label for="viewSelect">Business view</label><select id="viewSelect"><option value="all">Full company</option><option value="revenue">Sales → Payments → Collections</option><option value="debt">Debt Review Operations</option><option value="removal">Removal</option><option value="mediation">Mediation</option><option value="care">Customer Care</option><option value="people">HR & People</option><option value="it">IT & Access</option><option value="thynkverse">Thynkverse Layer</option></select></div>
  <div class="control"><label for="categorySelect">Show category</label><select id="categorySelect"><option value="all">All categories</option><option value="department">Departments</option><option value="product">Products</option><option value="process">Processes</option><option value="checkpoint">Checkpoints</option><option value="system">IT / systems</option><option value="thynkverse">Thynkverse</option></select></div>
  <div class="layoutState" id="layoutState"><span class="statusDot"></span>Layout ready</div>
</div>
<main>
  <section class="mapWrap">
    <div id="mapHint" class="mapHint">Tap a box to explain it. Turn on Edit layout to move boxes.</div>
    <div id="cy"></div>
    <div class="legend"><span>Blue Department</span><span>Orange Product / Thynkverse</span><span>Green Process</span><span>Yellow Checkpoint</span><span>Purple IT / System</span></div>
  </section>
  <aside><div class="detail" id="detail"></div></aside>
</main>
<div class="mobileDock"><button id="mobileFit" class="btn">Fit map</button><button id="mobileEdit" class="btn">Edit boxes</button><button id="mobileReset" class="btn">Reset layout</button></div>
</div>
<script>
const D={
company:{title:'Company',type:'Business Architecture',cat:'company',desc:'The complete operating model. A healthy structure shows where revenue enters, where control happens, where operations deliver the product, how clients are supported, and which people and systems make the work possible.',why:'This is the management view. It lets an owner see the whole company as one connected system instead of separate departments.',owner:'Owner / Management',systems:['Microsoft 365','SharePoint','CRM','Company domain'],needs:['Company strategy','Product list','Department owners','Escalation rules','Access register'],advice:'Start with the customer journey, then add supporting departments. Every box should have an owner, minimum inputs, output and next hand-off.',next:['sales','customercare','hr','it','thynkverse']},
sales:{title:'Sales',type:'Department',cat:'department',desc:'Sales receives and works leads, explains the correct product, qualifies the client, obtains the required signed pack and completes the minimum client information before hand-off.',why:'Sales is the front door. If Sales sends incomplete or incorrectly qualified files, every department after it loses time.',owner:'Sales Manager',systems:['VICIdial','CRM','WhatsApp','Microsoft 365'],needs:['Agent login','VICIdial campaign / extension','Lead source','Product scripts','Signed application / mandate','ID / client details','Contact details'],advice:'Measure quality as well as volume. A sale is not operationally complete until the required information is present.',next:['salescomplete']},
salescomplete:{title:'Sales Complete',type:'Quality Gate',cat:'checkpoint',desc:'Confirms that the sales file is sufficiently complete to progress to payment setup.',why:'A visible gate prevents incomplete files being pushed downstream simply to increase sales numbers.',owner:'Sales / QA',systems:['CRM','Document repository'],needs:['Correct product','Signed pack','Client identification','Contact details','Required supporting documents'],advice:'Use a checklist and block progression when mandatory items are missing.',next:['payments']},
payments:{title:'Payments',type:'Revenue Process',cat:'process',desc:'Creates or verifies the client payment arrangement and records the provider reference or mandate status.',why:'Separating payment setup from Sales gives management visibility between a signed customer and a financially activated customer.',owner:'Payments / Finance',systems:['Payment provider','CRM','Banking records'],needs:['Payment method','Authority / mandate where applicable','Provider reference','Payment date / amount','Successful setup status'],advice:'Record the payment-provider status as structured data so Collections does not have to re-check manually.',next:['collections']},
collections:{title:'Collections',type:'Department',cat:'department',desc:'Tracks expected payments, successful collections, missed payments, promises to pay, reconciliation and escalations.',why:'Collections protects recurring revenue and keeps active clients from silently falling out of the service journey.',owner:'Collections Manager',systems:['Payment provider portal','CRM','Bank reconciliation','Phone / email'],needs:['Payment schedule','Client reference','Provider login','Failed-payment queue','Follow-up rules','Escalation path'],advice:'Separate normal collections from exceptions. Automation should surface failed or unusual cases for humans.',next:['products','customercare']},
products:{title:'Products',type:'Product Routing',cat:'process',desc:'After the commercial hand-off, the client enters the correct delivery process: Debt Review, Removal or Mediation.',why:'Products need their own operating flows because the evidence, stages and outcomes differ.',owner:'Operations Manager',systems:['CRM','SharePoint','Workflow automation'],needs:['Product confirmed','Payment status','Complete file','Operations assignment'],advice:'One client record should keep the complete history even when the product changes or the case moves between teams.',next:['debt','removal','mediation']},
debt:{title:'Debt Review',type:'Product',cat:'product',desc:'Debt Review enters Operations and moves through staged work so every case has a visible current position, missing requirement, owner and next action.',why:'Stage control prevents cases being worked from memory or private spreadsheets.',owner:'Debt Review Operations',systems:['CRM','SharePoint','Credit / bureau tools','Email','MicroSIP / landline'],needs:['Operations access','Signed client file','Credit information','Income / expenditure information','Case owner','Communication access'],advice:'Treat each stage as a controlled gate. Save proof before advancing the file.',next:['dr1']},
dr1:{title:'Stage 1 — 17.1 & Flag',type:'Debt Review Stage',cat:'process',desc:'Initial operational stage covering the organisation’s 17.1 workflow and internal flag checks.',why:'It creates the first visible operational checkpoint and makes exceptions visible early.',owner:'Operations',systems:['CRM','Credit data','Flag automation','Email'],needs:['Client record','Signed documentation','Credit information','Flag checks','Evidence / case notes'],advice:'Automate repetitive flag detection, but keep exception review visible to staff.',next:['dr2']},
dr2:{title:'Stage 2 — 17.2 & SDL',type:'Debt Review Stage',cat:'process',desc:'Second controlled stage for the company’s 17.2 and SDL workflow, with required proof and communication recorded.',why:'Staff should see exactly what is missing before they can move the matter forward.',owner:'Operations',systems:['CRM','Email','Document storage','Workflow automation'],needs:['Stage 1 complete','Required notices / documents','SDL requirement','Communication proof','Case notes'],advice:'Use due dates and alerts for outstanding items rather than relying on daily manual checking.',next:['dr3']},
dr3:{title:'Stage 3 — Proposal',type:'Debt Review Stage',cat:'process',desc:'Proposal preparation, review and submission workflow based on the company’s approved operating procedure.',why:'Proposal work has multiple inputs and should have an explicit review point before submission.',owner:'Operations / Reviewer',systems:['CRM','Templates','SharePoint','Email'],needs:['Updated financial data','Creditor data','Proposal inputs','Review completed','Submission evidence'],advice:'Keep the approved template, input data and final version together so rework is traceable.',next:['dr4']},
dr4:{title:'Stage 4 — Rework',type:'Debt Review Stage',cat:'process',desc:'Dedicated queue for files requiring correction, missing evidence, revised calculations or resubmission.',why:'Without a separate rework queue, stalled files disappear into normal operations and ageing becomes difficult to manage.',owner:'Operations',systems:['CRM task queue','Email','SharePoint'],needs:['Rework reason','Assigned owner','Outstanding items','Due date','Resubmission proof'],advice:'Track rework reasons. Repeated reasons show where training or upstream process changes are needed.',next:['dr5']},
dr5:{title:'Stage 5 — Legal',type:'Debt Review Stage',cat:'process',desc:'Legal hand-off, route selection and matter tracking through the organisation’s approved legal process.',why:'Legal hand-offs need complete packs, clear ownership and visible external references.',owner:'Legal / Operations',systems:['Legal register','CRM','SharePoint','Email'],needs:['Complete case pack','Legal route confirmed','Submission / filing evidence','Matter reference','Outcome captured'],advice:'Do not hard-code legal assumptions into automation. Use the organisation’s approved legal/compliance rules.',next:['legalroute']},
legalroute:{title:'NCT / Magistrate',type:'Legal Route',cat:'checkpoint',desc:'Branch for the applicable NCT or Magistrate Court path as determined by the company’s approved legal process.',why:'Different legal routes may need different documents, dates and evidence.',owner:'Legal / Compliance',systems:['Case register','Document repository'],needs:['Route confirmed','Reference number','Required pack','Dates','Outcome'],advice:'The Flow should show the route and requirements, while legal staff remain responsible for the legal determination.',next:['customercare']},
removal:{title:'Debt Review Removal',type:'Product',cat:'product',desc:'Removal has a verification, action and confirmation journey. Once confirmed, the case enters completion and client-care follow-up.',why:'The business needs clear proof between a requested removal and a confirmed completed outcome.',owner:'Removal Operations',systems:['CRM','Credit / bureau sources','SharePoint','Email / phone'],needs:['Identity check','Current-status evidence','Eligibility / reason evidence','Signed authority','Case record'],advice:'Do not mark a removal complete until confirmation evidence is attached to the case.',next:['remverify']},
remverify:{title:'Removal Verification',type:'Control Gate',cat:'checkpoint',desc:'Verifies the case evidence, current status and required authority before operational action.',why:'Prevents unsupported cases being treated as ready for action.',owner:'Removal Operations',systems:['CRM','Document storage','Bureau / source tools'],needs:['Evidence checked','Case notes','Approval / exception status','Supporting documents'],advice:'If verification fails, route the case to an exception queue with a reason.',next:['remaction']},
remaction:{title:'Removal Action',type:'Operations Process',cat:'process',desc:'The approved removal action is processed and tracked with responsible owner, dates and evidence.',why:'Creates a traceable sequence from verification to action.',owner:'Removal Operations',systems:['CRM','Email','Relevant external portal'],needs:['Verified file','Assigned owner','Action record','Submission / communication evidence'],advice:'Capture external reference numbers where available.',next:['remconfirm']},
remconfirm:{title:'Removal Confirmed',type:'Completion Gate',cat:'checkpoint',desc:'Confirmation is captured, the customer is informed and the matter flows into completion or follow-up.',why:'A process is not complete until the result is documented and communicated.',owner:'Removal / Customer Care',systems:['CRM','WhatsApp / email','SharePoint'],needs:['Confirmation evidence','Client communication','Final notes','Follow-up status'],advice:'Make the confirmation visible to Customer Care so they can answer the client without asking Operations.',next:['customercare']},
mediation:{title:'Mediation',type:'Product',cat:'product',desc:'Mediation provides a structured journey for opening the matter, gathering evidence, engaging parties, negotiating and recording the outcome.',why:'Communication-heavy work becomes difficult to manage when calls, WhatsApp and email are not linked to one case.',owner:'Mediation Operations',systems:['CRM','Email','WhatsApp / phone','Document repository'],needs:['Client authority','Case background','Evidence','Party contacts','Desired resolution'],advice:'Keep all promises, offers and deadlines attached to the case timeline.',next:['medopen']},
medopen:{title:'Open Mediation Case',type:'Mediation Process',cat:'process',desc:'Creates the complete case record and identifies parties, issue, evidence and intended outcome.',why:'Negotiation should start from one controlled case record.',owner:'Mediation',systems:['CRM','SharePoint'],needs:['Case summary','Parties','Evidence','Desired outcome','Assigned agent'],advice:'Use standard case categories so management can analyse trends.',next:['medcontact']},
medcontact:{title:'Engage & Negotiate',type:'Mediation Process',cat:'process',desc:'Logs contact attempts, discussions, offers, counter-offers, supporting evidence and deadlines.',why:'Central logging prevents important agreements being lost in individual inboxes or phones.',owner:'Mediation',systems:['Email','WhatsApp','MicroSIP','CRM'],needs:['Contact history','Conversation notes','Offers / responses','Deadlines','Escalations'],advice:'Automate reminders; keep negotiation decisions human.',next:['medoutcome']},
medoutcome:{title:'Mediation Outcome',type:'Completion Gate',cat:'checkpoint',desc:'Records the agreement, unresolved result or next route and communicates it to the customer.',why:'The outcome closes the case loop and provides a clean hand-off to Customer Care.',owner:'Mediation / Customer Care',systems:['CRM','Document storage'],needs:['Outcome','Agreement / evidence','Client notified','Next action'],advice:'Use structured outcome reasons to improve reporting.',next:['customercare']},
customercare:{title:'Customer Care',type:'Department',cat:'department',desc:'Supports clients across the lifecycle: status updates, queries, documents, complaints, missed communication and retention.',why:'Customer Care needs direct visibility of operational status so clients receive answers without internal chasing.',owner:'Customer Care Manager',systems:['CRM','WhatsApp','Email','MicroSIP','StatusFlow'],needs:['Customer Care login','Identity verification process','Status access','Templates','Escalation matrix','Complaint workflow'],advice:'Customer Care should read the same stage status that Operations updates.',next:['carequery','carestatus','careescalation']},
carequery:{title:'Client Query',type:'Care Process',cat:'process',desc:'Capture and resolve a customer question using the latest case and workflow information.',why:'Turns calls into traceable service records.',owner:'Customer Care',systems:['CRM','Phone','WhatsApp'],needs:['Identity check','Query category','Current case status','Resolution note'],advice:'Measure repeat query categories to identify communication gaps.',next:[]},
carestatus:{title:'Status Update',type:'Care Process',cat:'process',desc:'Provides a clear update showing current stage, outstanding requirement and next expected action.',why:'Clients receive consistent answers based on the real process.',owner:'Customer Care',systems:['StatusFlow','CRM','Messaging'],needs:['Current stage','Outstanding item','Next action'],advice:'Use plain-language client status names even when internal stages are technical.',next:[]},
careescalation:{title:'Escalation / Complaint',type:'Care Process',cat:'process',desc:'Routes unresolved or sensitive matters to a named owner with priority and due date.',why:'Prevents complaints being passed informally without accountability.',owner:'Customer Care / Management',systems:['CRM tasks','Email','Alerts'],needs:['Issue summary','Priority','Assigned owner','Due date','Outcome'],advice:'Escalations need one owner, not a group mailbox.',next:[]},
hr:{title:'HR',type:'People Department',cat:'department',desc:'HR connects employees to the operating model through recruitment, onboarding, attendance, roles, training, SOPs, performance and offboarding.',why:'A process only works when the right person is trained and has the right access.',owner:'HR',systems:['Thynk HR','Microsoft 365','Training / SOP library'],needs:['Employee profile','Department / role','Manager','Working arrangement','Training plan','Access checklist'],advice:'Build role profiles from the process map: what the employee owns, systems needed, training and measurable outputs.',next:['hronboard','hrtraining','hroffboard']},
hronboard:{title:'Employee Onboarding',type:'HR Process',cat:'process',desc:'Creates employee records, assigns manager and role, provisions equipment and requests system access.',why:'Standard onboarding prevents missing access and unclear responsibility.',owner:'HR + IT + Manager',systems:['Thynk HR','Microsoft 365'],needs:['Employment record','Business email','Role permissions','Device','VICIdial / MicroSIP if needed','CRM access'],advice:'Access should be role-based rather than copied from another employee.',next:[]},
hrtraining:{title:'Training & SOP',type:'HR Process',cat:'process',desc:'Links each role to the relevant process boxes, SOPs, learning modules and completion evidence.',why:'The process map becomes a live training map, not just management documentation.',owner:'HR / Department Manager',systems:['Thynk HR Training','SOP library'],needs:['Role curriculum','SOP owner','Completion tracking','Review date'],advice:'When a process changes, identify which roles need retraining.',next:[]},
hroffboard:{title:'Offboarding',type:'HR + IT Gate',cat:'checkpoint',desc:'Disables access, transfers work, recovers equipment and closes the employee record.',why:'Removing email alone does not remove access to the business.',owner:'HR + IT',systems:['Microsoft 365','CRM','VICIdial','MicroSIP','Provider portals'],needs:['Disable accounts','Remove dialler / SIP','Reassign cases','Recover equipment','Close HR record'],advice:'Maintain one access register so offboarding can be verified.',next:[]},
it:{title:'IT & Access',type:'Infrastructure',cat:'system',desc:'Maintains the register of business systems, providers, login types, domains, phones, permissions and owners.',why:'The business should know who provides each critical service and what must change when people join or leave.',owner:'IT / Administrator',systems:['Microsoft 365','SharePoint','Domain / DNS','VICIdial','MicroSIP / SIP','CRM','Vercel','GitHub'],needs:['Provider register','Admin owner','Renewal dates','User list','MFA method','Support contact','Access-change procedure'],advice:'Never store staff passwords in this map. Store the system, owner, login URL and secure credential-location reference.',next:['itsales','itops','itdomain']},
itsales:{title:'Sales IT',type:'Access Bundle',cat:'system',desc:'Technology and access package required for a Sales agent.',why:'Makes Sales onboarding repeatable and measurable.',owner:'IT + Sales Manager',systems:['VICIdial','CRM','WhatsApp / messaging','Microsoft 365'],needs:['VICIdial URL','Agent username','Campaign / queue','Headset / phone','CRM role','Business email'],advice:'Keep campaign and queue assignment controlled by Sales management.',next:[]},
itops:{title:'Operations IT',type:'Access Bundle',cat:'system',desc:'Technology and access package for Operations and Admin, including communication and case systems.',why:'Operations cannot deliver consistently without reliable system and telephone access.',owner:'IT + Operations Manager',systems:['CRM','MicroSIP / SIP landline','Microsoft 365','SharePoint','External portals'],needs:['MicroSIP account / extension','SIP / landline provider','CRM role','SharePoint permissions','External portal logins'],advice:'Record the actual phone/SIP provider once confirmed. Keep provider details editable per client company.',next:[]},
itdomain:{title:'Domain, Email & Providers',type:'Infrastructure Register',cat:'system',desc:'Central register for domain/DNS, website, email tenant, telecom provider, payment provider and other external services.',why:'Critical services should not depend on one person remembering where they are hosted.',owner:'IT / Management',systems:['Domain / DNS provider','Microsoft 365','Vercel','GitHub','SIP provider','Payment provider'],needs:['Provider name','Account owner','Admin URL','Billing / renewal owner','MFA recovery process','Support contact'],advice:'This register should eventually be a secure admin-only record, with no passwords exposed to clients.',next:[]},
thynkverse:{title:'Thynkverse',type:'Automation Layer',cat:'thynkverse',desc:'Thynkverse spans the company and connects process design, dashboards, document storage, RPA, communication, HR and status visibility.',why:'Automation should connect the business, not create another isolated tool.',owner:'Thynkverse + Company Process Owners',systems:['Flow','CRM','StatusFlow','Chatto','FlagBot','iThynk','Thynk HR','SharePoint','Vercel','GitHub'],needs:['Approved process map','Data owner','Integration permissions','Exception rules','Secure access'],advice:'Automate repetitive rules; keep judgement, exceptions, legal decisions and sensitive approvals with people.',next:['tvdata','tvauto','tvpeople']},
tvdata:{title:'Data & Documents',type:'Platform Layer',cat:'thynkverse',desc:'Connects company-owned records, structured process data and documents to the workflow.',why:'Automation needs a controlled source of truth.',owner:'Company + Thynkverse',systems:['SharePoint','Microsoft 365','CRM'],needs:['Sites / libraries','Data fields','Permissions','Retention rules'],advice:'The company should own its operational data even when Thynkverse builds the interface.',next:[]},
tvauto:{title:'RPA & Automation',type:'Platform Layer',cat:'thynkverse',desc:'Bots and workflows perform repetitive work while human checkpoints remain visible.',why:'Reduces manual effort and errors without hiding responsibility.',owner:'Thynkverse + Process Owner',systems:['RPA tools','APIs','Power Automate where appropriate'],needs:['Trigger','Inputs','Expected output','Exception path','Audit trail'],advice:'Every automation needs an exception queue and a human owner.',next:[]},
tvpeople:{title:'People & Training',type:'Platform Layer',cat:'thynkverse',desc:'Thynk HR connects employee roles, attendance, SOPs, training and permissions to the work shown in Flow.',why:'The business map can become the training and accountability map.',owner:'HR + Thynkverse',systems:['Thynk HR','SOP / Learning'],needs:['Role map','Training modules','SOP links','Completion evidence'],advice:'This creates a direct line from company structure → process → role → training → system access.',next:[]}
};
const EDGE=[['company','sales'],['company','customercare'],['company','hr'],['company','it'],['company','thynkverse'],['sales','salescomplete'],['salescomplete','payments'],['payments','collections'],['collections','products'],['collections','customercare'],['products','debt'],['products','removal'],['products','mediation'],['debt','dr1'],['dr1','dr2'],['dr2','dr3'],['dr3','dr4'],['dr4','dr5'],['dr5','legalroute'],['legalroute','customercare'],['removal','remverify'],['remverify','remaction'],['remaction','remconfirm'],['remconfirm','customercare'],['mediation','medopen'],['medopen','medcontact'],['medcontact','medoutcome'],['medoutcome','customercare'],['customercare','carequery'],['customercare','carestatus'],['customercare','careescalation'],['hr','hronboard'],['hr','hrtraining'],['hr','hroffboard'],['it','itsales'],['it','itops'],['it','itdomain'],['thynkverse','tvdata'],['thynkverse','tvauto'],['thynkverse','tvpeople']];
const VIEW={all:Object.keys(D),revenue:['company','sales','salescomplete','payments','collections','products'],debt:['company','sales','salescomplete','payments','collections','products','debt','dr1','dr2','dr3','dr4','dr5','legalroute','customercare'],removal:['company','sales','salescomplete','payments','collections','products','removal','remverify','remaction','remconfirm','customercare'],mediation:['company','sales','salescomplete','payments','collections','products','mediation','medopen','medcontact','medoutcome','customercare'],care:['company','collections','customercare','carequery','carestatus','careescalation'],people:['company','hr','hronboard','hrtraining','hroffboard','it'],it:['company','it','itsales','itops','itdomain','hr','hroffboard'],thynkverse:['company','thynkverse','tvdata','tvauto','tvpeople','it','hr']};
const colors={company:'#f2ece1',department:'#78a9ff',product:'#f28b30',process:'#64c98d',checkpoint:'#e4c25f',system:'#b595ff',thynkverse:'#f28b30'};
const elements=[];Object.entries(D).forEach(([id,d])=>elements.push({data:{id,label:d.title,cat:d.cat}}));EDGE.forEach((e,i)=>elements.push({data:{id:'e'+i,source:e[0],target:e[1]}}));
const pathParts=location.pathname.split('/').filter(Boolean);const companyCode=(pathParts[0]==='c'&&pathParts[1]?pathParts[1]:'MASTER').toUpperCase();const storageKey='thynkverse-flow-layout-'+companyCode;
let editMode=false;
const cy=cytoscape({container:document.getElementById('cy'),elements,layout:{name:'breadthfirst',directed:true,roots:'#company',spacingFactor:1.35,padding:60},autoungrabify:true,minZoom:.18,maxZoom:2.2,wheelSensitivity:.18,style:[{selector:'node',style:{'background-color':n=>colors[n.data('cat')]||'#888','label':'data(label)','color':'#f6f6f6','font-size':10.5,'font-weight':800,'text-wrap':'wrap','text-max-width':105,'text-valign':'center','text-halign':'center','width':116,'height':54,'shape':'round-rectangle','border-width':1,'border-color':'#ffffff28','overlay-opacity':0}},{selector:'node[cat="company"]',style:{'color':'#181818','width':145,'height':64}},{selector:'node[cat="thynkverse"]',style:{'color':'#181818'}},{selector:'edge',style:{'width':1.6,'line-color':'#565c67','target-arrow-color':'#565c67','target-arrow-shape':'triangle','curve-style':'bezier','arrow-scale':.75,'opacity':.85}},{selector:':selected',style:{'border-width':3,'border-color':'#fff'}},{selector:'.hiddenNode',style:{'display':'none'}},{selector:'.searchDim',style:{'opacity':.1}},{selector:'.searchHit',style:{'border-width':4,'border-color':'#fff'}}]});
const detail=document.getElementById('detail'),layoutState=document.getElementById('layoutState'),editBtn=document.getElementById('editBtn'),mobileEdit=document.getElementById('mobileEdit');
function setState(txt){layoutState.innerHTML='<span class="statusDot"></span>'+txt}
function savePositions(){const data={};cy.nodes(':visible').forEach(n=>data[n.id()]=n.position());localStorage.setItem(storageKey,JSON.stringify(data));setState('Custom layout saved for '+companyCode)}
function loadPositions(){try{const raw=localStorage.getItem(storageKey);if(!raw)return false;const p=JSON.parse(raw);let count=0;cy.nodes().forEach(n=>{if(p[n.id()]){n.position(p[n.id()]);count++}});if(count){setState('Saved layout loaded for '+companyCode);return true}}catch(e){}return false}
function resetLayout(){localStorage.removeItem(storageKey);cy.nodes().removeClass('hiddenNode searchDim searchHit');cy.edges().removeClass('hiddenNode searchDim');document.getElementById('viewSelect').value='all';document.getElementById('categorySelect').value='all';cy.layout({name:'breadthfirst',directed:true,roots:'#company',spacingFactor:1.35,padding:60,animate:true,animationDuration:450}).run();setTimeout(()=>cy.fit(cy.elements(':visible'),55),500);setState('Default layout restored')}
function toggleEdit(force){editMode=typeof force==='boolean'?force:!editMode;cy.autoungrabify(!editMode);editBtn.classList.toggle('on',editMode);mobileEdit.classList.toggle('on',editMode);editBtn.textContent=editMode?'Lock layout':'Edit layout';mobileEdit.textContent=editMode?'Lock boxes':'Edit boxes';document.getElementById('mapHint').textContent=editMode?'Move any box. Connections follow automatically. Position saves when you release it.':'Tap a box to explain it. Turn on Edit layout to move boxes.';setState(editMode?'Editing — drag boxes to arrange':'Layout locked')}
function html(id){const d=D[id];return `<div class="eyebrow">${d.type}</div><h2>${d.title}</h2><div class="desc">${d.desc}</div><div class="why"><b>Why this is necessary</b><br>${d.why}</div><div class="advice"><b>Thynkverse advisory note</b><p>${d.advice}</p></div><div class="section"><h3>Responsible owner</h3><div class="pills"><span class="pill orange">${d.owner}</span></div></div><div class="section"><h3>Systems / tools</h3><div class="pills">${d.systems.map(x=>`<span class="pill">${x}</span>`).join('')}</div></div><div class="section"><h3>Minimum requirements</h3><div class="reqs">${d.needs.map(x=>`<div class="req">${x}</div>`).join('')}</div></div><div class="section"><h3>Next process</h3>${d.next.length?`<div class="nexts">${d.next.map(x=>`<button class="next" data-jump="${x}">${D[x].title}</button>`).join('')}</div>`:'<div class="empty">Current end point for this branch.</div>'}</div>`}
function show(id,focus=false){if(!D[id])return;detail.innerHTML=html(id);detail.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>show(b.dataset.jump,true));cy.$(':selected').unselect();const n=cy.$id(id);n.select();if(focus&&n.visible())cy.animate({center:{eles:n},zoom:Math.max(cy.zoom(),.85)},{duration:280});if(innerWidth<=900&&focus)detail.scrollIntoView({behavior:'smooth',block:'start'})}
function applyFilters(){const view=document.getElementById('viewSelect').value,cat=document.getElementById('categorySelect').value,allowed=new Set(VIEW[view]||VIEW.all);cy.nodes().forEach(n=>{const d=D[n.id()];const showView=allowed.has(n.id());const showCat=cat==='all'||d.cat===cat||n.id()==='company';n.toggleClass('hiddenNode',!(showView&&showCat))});cy.edges().forEach(e=>e.toggleClass('hiddenNode',!e.source().visible()||!e.target().visible()));setTimeout(()=>{const vis=cy.elements(':visible');if(vis.length)cy.fit(vis,55)},30);setState((view==='all'?'Full business':'Focused view')+' • '+(cat==='all'?'all categories':cat))}
cy.on('tap','node',e=>show(e.target.id()));cy.on('dbltap','node',e=>show(e.target.id(),true));cy.on('dragfree','node',()=>{if(editMode)savePositions()});
editBtn.onclick=()=>toggleEdit();mobileEdit.onclick=()=>toggleEdit();document.getElementById('fitBtn').onclick=()=>cy.fit(cy.elements(':visible'),55);document.getElementById('mobileFit').onclick=()=>cy.fit(cy.elements(':visible'),35);document.getElementById('resetBtn').onclick=resetLayout;document.getElementById('mobileReset').onclick=resetLayout;document.getElementById('viewSelect').onchange=applyFilters;document.getElementById('categorySelect').onchange=applyFilters;
document.getElementById('search').addEventListener('input',e=>{const q=e.target.value.trim().toLowerCase();cy.nodes().removeClass('searchDim searchHit');cy.edges().removeClass('searchDim');if(!q)return;let hit=cy.collection();cy.nodes(':visible').forEach(n=>{const d=D[n.id()],hay=[d.title,d.type,d.desc,d.why,d.owner,d.advice,...d.systems,...d.needs].join(' ').toLowerCase();if(hay.includes(q)){n.addClass('searchHit');hit=hit.union(n)}else n.addClass('searchDim')});cy.edges(':visible').addClass('searchDim');if(hit.length)cy.animate({fit:{eles:hit,padding:75}},{duration:250})});
show('company');setTimeout(()=>{if(!loadPositions())cy.fit(cy.elements(':visible'),55);else cy.fit(cy.elements(':visible'),55)},120);
</script>
</body>
</html>
