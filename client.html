<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thynkverse Client Flow</title><style>html,body{margin:0;height:100%;background:#0f1012;color:#f4f1eb;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}.shell{height:100%;display:grid;grid-template-rows:auto 1fr}.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 16px;background:#15171b;border-bottom:1px solid #343842}.brand{display:flex;gap:10px;align-items:center}.logo{width:34px;height:34px;border-radius:10px;background:#f28b30;display:grid;place-items:center;color:#161616;font-weight:900}.name{font-weight:850}.meta{font-size:12px;color:#a7adb7;margin-top:2px}.abbr{border:1px solid #40444e;border-radius:999px;padding:6px 9px;font-size:12px;color:#d9dde3}.frame{width:100%;height:100%;border:0;background:#0f1012}</style></head><body><div class="shell"><div class="bar"><div class="brand"><div class="logo">T</div><div><div id="company" class="name">Client Business Flow</div><div id="owner" class="meta">Powered & designed by Thynkverse</div></div></div><div id="abbr" class="abbr">FLOW</div></div><iframe id="flowFrame" class="frame" title="Interactive business flow" src="/"></iframe></div><script>const p=new URLSearchParams(location.search);const parts=location.pathname.split('/').filter(Boolean);const code=(parts[1]||'FLOW').toUpperCase();const name=p.get('name')||'Client Business Flow';const own=p.get('owner');document.getElementById('company').textContent=name;document.getElementById('abbr').textContent=code;document.title=name+' — Thynkverse Flow';document.getElementById('owner').textContent=own?('Owner: '+own+' • Powered & designed by Thynkverse'):'Powered & designed by Thynkverse';</script></body></html>
