<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Interactive Thynkverse business process map for sales, collections, debt review, removal, mediation, customer care, HR and IT." />
  <title>Thynkverse Flow</title>
  <script src="https://unpkg.com/cytoscape@3.30.2/dist/cytoscape.min.js"></script>
  <style>
    :root{--bg:#0f1012;--panel:#17191d;--panel2:#1e2126;--line:#353942;--text:#f4f1eb;--muted:#a7adb7;--orange:#f28b30;--orange2:#ffad63;--green:#5ec98a;--yellow:#e6c35c;--red:#e66d6d;--blue:#70a7ff;--purple:#b48cff;--cream:#f3ede2}
    *{box-sizing:border-box} html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
    button,input{font:inherit} button{cursor:pointer} .app{min-height:100vh;display:grid;grid-template-rows:auto auto 1fr;background:radial-gradient(circle at top right,rgba(242,139,48,.1),transparent 30%),var(--bg)}
    header{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:16px 20px;border-bottom:1px solid var(--line);background:rgba(15,16,18,.95);position:sticky;top:0;z-index:20;backdrop-filter:blur(10px)}
    .brand{display:flex;align-items:center;gap:12px}.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(145deg,var(--orange),#d75a17);display:grid;place-items:center;font-weight:900;color:#161616}.brand h1{font-size:17px;margin:0}.brand p{font-size:12px;margin:2px 0 0;color:var(--muted)}
    .actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:9px 12px;border-radius:10px}.btn:hover{border-color:#5c626f}.btn.primary{background:var(--orange);border-color:var(--orange);color:#171717;font-weight:800}
    .topbar{display:flex;gap:8px;align-items:center;padding:10px 20px;border-bottom:1px solid var(--line);overflow:auto;background:#121316}.chip{white-space:nowrap;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:7px 11px}.chip.active{background:var(--cream);color:#1a1a1a;border-color:var(--cream);font-weight:800}
    main{min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 390px}.canvasWrap{position:relative;min-height:720px;overflow:hidden}.hint{position:absolute;z-index:10;left:16px;top:14px;padding:9px 11px;border:1px solid var(--line);background:rgba(23,25,29,.9);border-radius:10px;color:var(--muted);font-size:12px;pointer-events:none}.legend{position:absolute;left:16px;bottom:16px;z-index:10;display:flex;gap:7px;flex-wrap:wrap;max-width:70%}.legend span{font-size:11px;background:rgba(23,25,29,.94);border:1px solid var(--line);padding:5px 7px;border-radius:999px;color:var(--muted)}#cy{position:absolute;inset:0}
    aside{border-left:1px solid var(--line);background:var(--panel);padding:20px;overflow:auto;max-height:calc(100vh - 116px)}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.13em;color:var(--orange2);font-weight:800}.detail h2{font-size:25px;line-height:1.1;margin:7px 0 8px}.detail .desc{color:#c7cbd2;line-height:1.55;font-size:14px;margin-bottom:18px}.section{border-top:1px solid var(--line);padding-top:15px;margin-top:15px}.section h3{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 10px}.list{display:grid;gap:8px}.item{background:var(--panel2);border:1px solid #2f333b;border-radius:11px;padding:10px 11px}.item b{display:block;font-size:13px}.item small{display:block;margin-top:4px;color:var(--muted);line-height:1.4}.badge{display:inline-block;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:800;margin:0 5px 5px 0;background:#2b3038;color:#d7dbe1}.badge.orange{background:rgba(242,139,48,.14);color:var(--orange2)}.badge.green{background:rgba(94,201,138,.12);color:#8de3af}.badge.yellow{background:rgba(230,195,92,.12);color:#f0d579}.route{padding:10px;border-left:2px solid var(--orange);background:rgba(242,139,48,.07);font-size:13px;line-height:1.5;color:#ddd}.note{font-size:12px;color:var(--muted);line-height:1.45}.search{min-width:180px;border:1px solid var(--line);background:#0f1012;color:var(--text);border-radius:10px;padding:9px 11px}.empty{text-align:center;padding:30px 5px;color:var(--muted)}
    .stack{display:flex;gap:6px;flex-wrap:wrap}.mini{border:1px solid var(--line);background:#111317;color:var(--muted);padding:6px 8px;border-radius:8px;font-size:11px}.mini:hover{color:var(--text);border-color:#606774}
    @media(max-width:900px){main{grid-template-columns:1fr}.canvasWrap{min-height:590px}aside{border-left:0;border-top:1px solid var(--line);max-height:none}.hint{top:10px}.legend{max-width:92%}}
  </style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><div class="logo">T</div><div><h1>Thynkverse Flow</h1><p>Interactive business architecture & automation map</p></div></div>
    <div class="actions">
      <input id="search" class="search" placeholder="Find a process or system…" />
      <button class="btn" id="fitBtn">Far View</button>
      <button class="btn primary" id="resetBtn">Start from Company</button>
    </div>
  </header>
  <div class="topbar" id="filters"></div>
  <main>
    <section class="canvasWrap">
      <div class="hint">Click a node to explain it • double-click to focus • scroll to zoom • drag to move</div>
      <div id="cy"></div>
      <div class="legend"><span>Orange = Thynkverse</span><span>Blue = Department</span><span>Green = Process</span><span>Purple = System / IT</span><span>Yellow = Checkpoint</span></div>
    </section>
    <aside>
      <div class="detail" id="detail"></div>
    </aside>
  </main>
</div>
<script>
const D={
 company:{title:'Company',type:'Business structure',cat:'company',desc:'The complete operating model. Revenue starts in Sales, moves through payment and collections, and then into the product-specific operational journey. Customer Care, HR, IT and Thynkverse support the full lifecycle.',why:'This top view gives management one place to understand how departments depend on each other and where automation removes repetitive work.',owner:'Management',systems:['Microsoft 365 / SharePoint','Company domain & email','Thynkverse automation layer'],needs:['Approved department structure','Named process owners','Escalation rules','Access and login register'],next:['sales','customercare','hr','it','thynkverse']},
 sales:{title:'Sales',type:'Department',cat:'department',desc:'Sales owns lead contact, qualification, product selection, customer communication and completion of the signed sales pack before the file can progress.',why:'Operations should not receive incomplete files. Sales must complete the minimum onboarding requirements first.',owner:'Sales Manager',systems:['VICIdial','WhatsApp / messaging','CRM','Email'],needs:['Agent login','VICIdial campaign & extension','WhatsApp process','Product script','Signed application / mandate','Identity information','Contact details','Required disclosures'],next:['sales_complete']},
 sales_complete:{title:'Sales Complete',type:'Control gate',cat:'checkpoint',desc:'A quality gate confirming the customer file is complete enough to move out of Sales.',why:'Stops incomplete files from being pushed downstream and makes responsibility visible.',owner:'Sales / QA',systems:['CRM','Document storage'],needs:['Signed pack','ID / identification','Correct product','Contact details','Required documents marked received'],next:['payments']},
 payments:{title:'Payments',type:'Process',cat:'process',desc:'The payment setup or payment-provider step is completed and verified before the account enters collections.',why:'Separates successful sale from successful payment setup and gives the business a clear hand-off.',owner:'Payments / Finance',systems:['Payment provider','CRM','Banking or mandate records'],needs:['Payment method','Mandate / authority where applicable','Payment reference','Provider login','Successful setup confirmation'],next:['collections']},
 collections:{title:'Collections',type:'Department / process',cat:'department',desc:'Collections manages expected payments, missed payments, payment follow-up, reconciliation and escalations. Successful collection keeps the client active in the chosen product journey.',why:'Revenue protection and client continuity depend on knowing what was due, what was received and what requires action.',owner:'Collections',systems:['Payment provider portal','CRM','Banking / reconciliation','Email / phone'],needs:['Collections login','Payment schedule','Client account reference','Exception queue','Escalation rules','Promise-to-pay tracking'],next:['products','customercare']},
 products:{title:'Products',type:'Product hub',cat:'process',desc:'The customer is routed into the correct product workflow after Sales, Payments and Collections.',why:'Each product has different operational milestones, evidence and regulatory or company requirements.',owner:'Operations',systems:['CRM','SharePoint','Automation'],needs:['Product selected','File complete','Payment status','Assigned operations queue'],next:['debt','removal','mediation']},
 debt:{title:'Debt Review',type:'Product',cat:'product',desc:'Debt Review moves into Operations and is worked through defined stages. Each stage can show its requirements, responsible team, systems, automation and proof of completion.',why:'Stage-based control gives staff and management a common view of exactly where every file sits and what is blocking progress.',owner:'Debt Review Operations',systems:['CRM','SharePoint','Credit / bureau systems','Email','MicroSIP / landline'],needs:['Operations login set','Client documents','Credit information','Income and expenditure data','Case ownership','Call capability'],next:['dr1']},
 dr1:{title:'Stage 1 — 17.1 & Flag',type:'Debt Review stage',cat:'process',desc:'Initial operations stage for the 17.1-related workflow and internal flag checks configured by the business.',why:'Creates an early checkpoint before the file proceeds deeper into the debt review workflow.',owner:'Operations',systems:['CRM','Bureau / credit data','Flag automation','Email'],needs:['Client record','Required signed documentation','Credit information available','Flag conditions checked','Evidence saved'],next:['dr2']},
 dr2:{title:'Stage 2 — 17.2 & SDL',type:'Debt Review stage',cat:'process',desc:'Second operational stage for the company’s 17.2 and SDL workflow. The system should expose missing requirements and block progression until the configured checklist is complete.',why:'Makes the stage auditable and prevents staff from relying on memory.',owner:'Operations',systems:['CRM','Email','Document storage','Workflow automation'],needs:['Stage 1 complete','Required notices / documents','SDL requirement configured','Proof of communication','Case notes'],next:['dr3']},
 dr3:{title:'Stage 3 — Proposal',type:'Debt Review stage',cat:'process',desc:'Proposal preparation and processing stage. The exact document naming and compliance checklist should be configured from the company’s approved operating procedure.',why:'The map explains who prepares, checks and approves the proposal and where the supporting evidence lives.',owner:'Operations / Reviewer',systems:['CRM','Document templates','SharePoint','Email'],needs:['Updated financial data','Creditor data','Proposal inputs','Internal review','Submission proof'],next:['dr4']},
 dr4:{title:'Stage 4 — Rework',type:'Debt Review stage',cat:'process',desc:'Files requiring correction, additional evidence or a revised proposal enter a visible rework queue rather than disappearing into general operations.',why:'A dedicated rework stage exposes bottlenecks and repeat failure reasons.',owner:'Operations',systems:['CRM task queue','Email','SharePoint'],needs:['Reason for rework','Owner assigned','Outstanding items','Due date','Resubmission proof'],next:['dr5']},
 dr5:{title:'Stage 5 — Legal',type:'Debt Review stage',cat:'process',desc:'Legal hand-off and case tracking stage. The map can distinguish the company’s NCT and Magistrate Court paths and display the evidence required for each.',why:'Legal hand-offs are high-risk operational points and need clear ownership, status and proof.',owner:'Legal / Operations',systems:['Legal case tracking','CRM','SharePoint','Email'],needs:['Complete case pack','Legal route confirmed','Submission / filing proof','Hearing or matter reference','Outcome captured'],next:['legal_routes']},
 legal_routes:{title:'NCT / Magistrate Route',type:'Legal branch',cat:'checkpoint',desc:'A configurable branch showing whether a matter follows the relevant NCT or Magistrate Court route. Legal rules must come from the organisation’s approved compliance process.',why:'The visual map can show different requirements without forcing staff to remember which route applies.',owner:'Legal / Compliance',systems:['Case register','Document repository'],needs:['Route confirmed','Reference number','Required documents','Dates and outcome'],next:['customercare']},
 removal:{title:'Debt Review Removal',type:'Product',cat:'product',desc:'Removal follows its own verification and operations sequence. Once removal is confirmed, the file moves into a completion flow and customer communication process.',why:'Removal needs visible proof of eligibility, evidence, action taken and final confirmation.',owner:'Removal Operations',systems:['CRM','Credit / bureau sources','SharePoint','Email / phone'],needs:['Identity check','Current status evidence','Reason / eligibility evidence','Authority / signed documents','Required case records'],next:['rem_verify']},
 rem_verify:{title:'Removal Verification',type:'Control gate',cat:'checkpoint',desc:'Operations verifies the removal case before any action is marked complete.',why:'Prevents unsupported removal claims from being treated as completed.',owner:'Removal Operations',systems:['CRM','Document storage','Bureau / source systems'],needs:['Evidence checked','Case notes','Approval or exception status','Required supporting documents'],next:['rem_action']},
 rem_action:{title:'Removal Action',type:'Process',cat:'process',desc:'The approved removal action is processed and tracked with proof, dates and responsible owner.',why:'Creates an auditable sequence from verification to action.',owner:'Removal Operations',systems:['CRM','Email','Relevant external portal if applicable'],needs:['Verified file','Assigned owner','Action record','Proof of submission / communication'],next:['rem_confirm']},
 rem_confirm:{title:'Removal Confirmed',type:'Completion gate',cat:'checkpoint',desc:'Confirmation is recorded, the client is informed and the case flows to completion / customer care.',why:'A case is only complete when the result is captured and communicated.',owner:'Removal / Customer Care',systems:['CRM','WhatsApp / email','SharePoint'],needs:['Confirmation evidence','Client communication','Final notes','Next follow-up if required'],next:['customercare']},
 mediation:{title:'Mediation',type:'Product',cat:'product',desc:'Mediation manages a structured customer / creditor resolution journey with documents, communication, proposed terms, responses and outcomes.',why:'A visible mediation flow helps teams track what is waiting on the client, the other party or internal action.',owner:'Mediation Operations',systems:['CRM','Email','WhatsApp / phone','Document repository'],needs:['Client mandate / authority','Case background','Supporting documents','Contact records','Proposed resolution','Outcome evidence'],next:['med_open']},
 med_open:{title:'Open Mediation Case',type:'Process',cat:'process',desc:'Create the case, collect the required evidence and identify the parties and issue to be mediated.',why:'Establishes one complete case record before negotiations begin.',owner:'Mediation',systems:['CRM','SharePoint'],needs:['Case summary','Parties','Evidence','Desired outcome','Assigned mediator / agent'],next:['med_contact']},
 med_contact:{title:'Engage & Negotiate',type:'Process',cat:'process',desc:'Communication, offers, counter-offers, supporting evidence and follow-ups are logged against the case.',why:'Central logging prevents agreements and promises from being lost in calls, WhatsApp or email.',owner:'Mediation',systems:['Email','WhatsApp','MicroSIP / phone','CRM'],needs:['Contact attempts','Conversation notes','Offers / responses','Deadlines','Escalations'],next:['med_outcome']},
 med_outcome:{title:'Mediation Outcome',type:'Completion gate',cat:'checkpoint',desc:'The final outcome, agreement or unresolved result is recorded with evidence and the customer moves to follow-up care.',why:'Closes the loop and gives Customer Care a complete history.',owner:'Mediation / Customer Care',systems:['CRM','Document storage'],needs:['Outcome recorded','Agreement / evidence','Customer notified','Next action'],next:['customercare']},
 customercare:{title:'Customer Care',type:'Department',cat:'department',desc:'Customer Care supports the client after onboarding and across product stages: queries, updates, documents, complaints, missed communications and retention.',why:'A shared view means Customer Care can answer the client without repeatedly asking Operations for basic status.',owner:'Customer Care Manager',systems:['CRM','WhatsApp','Email','MicroSIP / landline','StatusFlow'],needs:['Customer Care login','Call / messaging access','Status visibility','Templates','Escalation matrix','Complaint workflow'],next:['care_query','care_status','care_escalation']},
 care_query:{title:'Client Query',type:'Customer Care process',cat:'process',desc:'Capture the question, identify the case and resolve it using the latest workflow status and approved information.',why:'Every query becomes traceable rather than living only in a phone call.',owner:'Customer Care',systems:['CRM','Phone','WhatsApp'],needs:['Identity verification','Query category','Case status','Resolution note'],next:[]},
 care_status:{title:'Status Update',type:'Customer Care process',cat:'process',desc:'Provide a clear update based on the operational stage and outstanding requirements.',why:'Connects customer communication to the same process map used by Operations.',owner:'Customer Care',systems:['StatusFlow','CRM','Messaging'],needs:['Current stage','Outstanding item','Next expected action'],next:[]},
 care_escalation:{title:'Escalation / Complaint',type:'Customer Care process',cat:'process',desc:'Route unresolved or sensitive matters to the responsible department with an owner and due date.',why:'Prevents complaints from being passed informally with no accountability.',owner:'Customer Care / Management',systems:['CRM tasks','Email','Alerts'],needs:['Issue summary','Priority','Assigned owner','Due date','Outcome'],next:[]},
 hr:{title:'HR',type:'Business support',cat:'department',desc:'HR connects people to the operating model: recruitment, onboarding, attendance, roles, training, SOPs, performance and access removal when staff leave.',why:'Processes only work when the correct people are trained and have the correct systems access.',owner:'HR',systems:['Thynk HR','Microsoft 365','Training / SOP area'],needs:['Employee profile','Department & role','Manager','Working hours','Training requirements','System access checklist'],next:['hr_onboard','hr_training','hr_offboard']},
 hr_onboard:{title:'Employee Onboarding',type:'HR process',cat:'process',desc:'Create employee profile, assign department, manager, policies, equipment and system access.',why:'A standard checklist stops missing logins and unclear role ownership.',owner:'HR + IT + Manager',systems:['Thynk HR','Microsoft 365'],needs:['Employment records','Email account','Role permissions','Device','VICIdial / MicroSIP if required','CRM access'],next:[]},
 hr_training:{title:'Training & SOP',type:'HR process',cat:'process',desc:'Connect each role to the correct SOPs, process-map nodes, training modules and completion evidence.',why:'Staff can click the same flow they use at work and learn what each stage means.',owner:'HR / Department Manager',systems:['Thynk HR Training','SOP library'],needs:['Role curriculum','SOP owner','Completion tracking','Review dates'],next:[]},
 hr_offboard:{title:'Offboarding',type:'HR + IT control',cat:'checkpoint',desc:'Remove access, recover devices, transfer work and close the employee record.',why:'Security requires access removal across all systems, not only email.',owner:'HR + IT',systems:['Microsoft 365','CRM','VICIdial','MicroSIP','Provider portals'],needs:['Disable email','Remove CRM access','Remove dialler / SIP access','Reassign cases','Recover equipment'],next:[]},
 it:{title:'IT & Access',type:'Infrastructure',cat:'system',desc:'IT keeps a controlled register of every system, login type, provider, domain, phone service and owner needed by each department.',why:'The business should know who provides each service, who has access and what must be changed when staff join or leave.',owner:'IT / Administrator',systems:['Microsoft 365','SharePoint','Domain / DNS','VICIdial','MicroSIP / SIP','CRM','Vercel / GitHub where applicable'],needs:['Provider register','Admin owner','Renewal dates','User list','MFA method','Support contact','Access-change procedure'],next:['it_sales','it_ops','it_domain']},
 it_sales:{title:'Sales IT',type:'Access bundle',cat:'system',desc:'Minimum technology package for Sales.',why:'Makes onboarding a repeatable checklist.',owner:'IT + Sales Manager',systems:['VICIdial','CRM','WhatsApp / messaging','Microsoft 365'],needs:['VICIdial URL','Agent username','Campaign','Phone / headset','CRM role','Business email'],next:[]},
 it_ops:{title:'Operations IT',type:'Access bundle',cat:'system',desc:'Minimum technology package for Operations and Admin.',why:'Operations needs reliable communication and access to case information and documents.',owner:'IT + Operations Manager',systems:['CRM','MicroSIP / SIP landline','Microsoft 365','SharePoint','External portals'],needs:['MicroSIP account / extension','SIP or landline provider — confirm company provider','CRM role','SharePoint access','External system logins'],next:[]},
 it_domain:{title:'Domain, Email & Providers',type:'Infrastructure register',cat:'system',desc:'Central register for the company domain, DNS, website, email tenant, phone provider, payment provider and other external services.',why:'Critical services should not depend on one person remembering where they are hosted or how they are renewed.',owner:'IT / Management',systems:['Domain / DNS provider','Microsoft 365','Vercel','GitHub','SIP provider','Payment provider'],needs:['Provider name','Account owner','Admin URL','Renewal / billing owner','MFA recovery process','Support contact'],next:[]},
 thynkverse:{title:'Thynkverse',type:'Automation & platform layer',cat:'thynkverse',desc:'Thynkverse sits across the company rather than inside one department. It connects business processes, dashboards, document storage, RPA tools, HR and status visibility.',why:'The goal is not automation for its own sake. The map identifies repetitive work, required human decisions, system hand-offs and opportunities to reduce errors.',owner:'Thynkverse',systems:['Flow','CRM','StatusFlow','Chatto','FlagBot','iThynk','Thynk HR','SharePoint','Vercel','GitHub'],needs:['Approved process map','System access via secure company-controlled credentials','Integration permissions','Data owner','Automation exception rules'],next:['tv_data','tv_auto','tv_people']},
 tv_data:{title:'Data & Documents',type:'Thynkverse layer',cat:'thynkverse',desc:'SharePoint and connected business systems hold company-owned records, documents and structured process data.',why:'Automation needs a controlled source of truth.',owner:'Company + Thynkverse',systems:['SharePoint','Microsoft 365','CRM'],needs:['Sites / libraries','Lists / data fields','Permissions','Retention rules'],next:[]},
 tv_auto:{title:'RPA & Automation',type:'Thynkverse layer',cat:'thynkverse',desc:'Bots and workflows perform repetitive steps while human checkpoints remain visible in the process.',why:'Reduces repetitive manual work while preserving human review where judgement is required.',owner:'Thynkverse + Process Owner',systems:['RPA tools','APIs where available','Power Automate where appropriate'],needs:['Trigger','Inputs','Expected output','Exception path','Audit trail'],next:[]},
 tv_people:{title:'People & Training',type:'Thynkverse layer',cat:'thynkverse',desc:'Thynk HR links employees, attendance, training, SOPs and permissions back to the operational processes they perform.',why:'The business map becomes both an operational guide and a training map.',owner:'HR + Thynkverse',systems:['Thynk HR','SOP / learning content'],needs:['Role map','Training modules','SOP links','Competency / completion evidence'],next:[]}
};
const edges=[['company','sales'],['company','customercare'],['company','hr'],['company','it'],['company','thynkverse'],['sales','sales_complete'],['sales_complete','payments'],['payments','collections'],['collections','products'],['collections','customercare'],['products','debt'],['products','removal'],['products','mediation'],['debt','dr1'],['dr1','dr2'],['dr2','dr3'],['dr3','dr4'],['dr4','dr5'],['dr5','legal_routes'],['legal_routes','customercare'],['removal','rem_verify'],['rem_verify','rem_action'],['rem_action','rem_confirm'],['rem_confirm','customercare'],['mediation','med_open'],['med_open','med_contact'],['med_contact','med_outcome'],['med_outcome','customercare'],['customercare','care_query'],['customercare','care_status'],['customercare','care_escalation'],['hr','hr_onboard'],['hr','hr_training'],['hr','hr_offboard'],['it','it_sales'],['it','it_ops'],['it','it_domain'],['thynkverse','tv_data'],['thynkverse','tv_auto'],['thynkverse','tv_people']];
const colors={company:'#f3ede2',department:'#70a7ff',process:'#5ec98a',product:'#f28b30',checkpoint:'#e6c35c',system:'#b48cff',thynkverse:'#f28b30'};
const els=[];Object.entries(D).forEach(([id,d])=>els.push({data:{id,label:d.title,cat:d.cat}}));edges.forEach((e,i)=>els.push({data:{id:'e'+i,source:e[0],target:e[1]}}));
const cy=cytoscape({container:document.getElementById('cy'),elements:els,layout:{name:'breadthfirst',directed:true,roots:'#company',spacingFactor:1.35,padding:60},style:[{selector:'node',style:{'background-color':n=>colors[n.data('cat')]||'#888','label':'data(label)','color':'#f5f5f5','font-size':11,'font-weight':700,'text-wrap':'wrap','text-max-width':105,'text-valign':'center','text-halign':'center','width':120,'height':54,'shape':'round-rectangle','border-width':1,'border-color':'#ffffff26'}},{selector:'node[cat="company"]',style:{'color':'#161616','width':145,'height':64}},{selector:'node[cat="thynkverse"]',style:{'color':'#161616'}},{selector:'edge',style:{'width':1.6,'line-color':'#555b66','target-arrow-color':'#555b66','target-arrow-shape':'triangle','curve-style':'bezier','arrow-scale':.8}},{selector:':selected',style:{'border-width':3,'border-color':'#fff','overlay-color':'#fff','overlay-opacity':.05}},{selector:'.dim',style:{'opacity':.12}},{selector:'.hit',style:{'border-width':4,'border-color':'#fff'}}],minZoom:.22,maxZoom:2.1,wheelSensitivity:.18});
const detail=document.getElementById('detail');
function detailHTML(id){const d=D[id];const list=(arr)=>arr.map(x=>`<div class="item"><b>${x}</b></div>`).join('');return `<div class="eyebrow">${d.type}</div><h2>${d.title}</h2><div class="desc">${d.desc}</div><div class="route"><b>Why this is necessary</b><br>${d.why}</div><div class="section"><h3>Owner</h3><span class="badge orange">${d.owner}</span></div><div class="section"><h3>Systems / tools</h3><div class="stack">${d.systems.map(x=>`<span class="badge">${x}</span>`).join('')}</div></div><div class="section"><h3>Minimum requirements</h3><div class="list">${list(d.needs)}</div></div><div class="section"><h3>Next process</h3>${d.next.length?`<div class="stack">${d.next.map(n=>`<button class="mini jump" data-jump="${n}">${D[n].title}</button>`).join('')}</div>`:'<div class="note">End point for this branch in the current prototype.</div>'}</div>${['dr1','dr2','dr3','dr4','dr5','legal_routes'].includes(id)?'<div class="section"><div class="note">Compliance note: the stage labels reflect the requested operating model. Exact legal forms, route criteria and required evidence should be confirmed against the company’s approved South African compliance/legal procedure before this becomes a production checklist.</div></div>':''}`}
function show(id,focus=false){if(!D[id])return;detail.innerHTML=detailHTML(id);detail.querySelectorAll('.jump').forEach(b=>b.onclick=()=>show(b.dataset.jump,true));cy.$(':selected').unselect();const n=cy.$id(id);n.select();if(focus){cy.animate({center:{eles:n},zoom:Math.max(cy.zoom(),.9)},{duration:350})}}
show('company');
cy.on('tap','node',e=>show(e.target.id()));cy.on('dbltap','node',e=>show(e.target.id(),true));
document.getElementById('fitBtn').onclick=()=>cy.animate({fit:{eles:cy.elements(),padding:45}},{duration:350});document.getElementById('resetBtn').onclick=()=>{cy.elements().removeClass('dim hit');cy.layout({name:'breadthfirst',directed:true,roots:'#company',spacingFactor:1.35,padding:60}).run();setTimeout(()=>cy.fit(cy.elements(),55),80);show('company')};
const cats=[['all','All'],['product','Products'],['department','Departments'],['process','Processes'],['checkpoint','Checkpoints'],['system','IT / Systems'],['thynkverse','Thynkverse']];const filters=document.getElementById('filters');cats.forEach(([c,l],i)=>{const b=document.createElement('button');b.className='chip'+(i===0?' active':'');b.textContent=l;b.onclick=()=>{filters.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));b.classList.add('active');cy.elements().removeClass('dim');if(c!=='all'){cy.nodes().filter(n=>n.data('cat')!==c&&n.id()!=='company').addClass('dim');cy.edges().addClass('dim')} };filters.appendChild(b)});
document.getElementById('search').addEventListener('input',e=>{const q=e.target.value.trim().toLowerCase();cy.nodes().removeClass('hit dim');cy.edges().removeClass('dim');if(!q)return;let found=cy.collection();cy.nodes().forEach(n=>{const d=D[n.id()];const hay=[d.title,d.type,d.desc,d.owner,...d.systems,...d.needs].join(' ').toLowerCase();if(hay.includes(q)){n.addClass('hit');found=found.union(n)}else n.addClass('dim')});cy.edges().addClass('dim');if(found.length)cy.animate({fit:{eles:found,padding:90}},{duration:250})});
setTimeout(()=>cy.fit(cy.elements(),55),120);
</script>
</body>
